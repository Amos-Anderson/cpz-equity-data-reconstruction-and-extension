name: factor-pipeline
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  # Core scientific stack — fastest via conda
  - numpy>=1.26
  - pandas>=2.1
  - pyarrow>=14
  - scipy>=1.11
  - scikit-learn>=1.4
  # Stats / econometrics
  - statsmodels>=0.14
  # Plotting
  - plotly>=5.18
  - python-kaleido>=0.2
  # Jupyter
  - jupyter
  - ipykernel
  # Build tools
  # conda dependencies:
  - jupyter
  - ipykernel

  - pip:
      # Anaconda-unfriendly or pip-only
      - polars>=0.20
      - arch>=6.2
      - cvxpy>=1.4
      - lightgbm>=4.1
      - pyyaml>=6.0
      - python-dotenv>=1.0
      - pydantic>=2.5
      - wrds>=3.2
      - alpaca-py>=0.20
      - tqdm>=4.66
      - joblib>=1.3
      # Dev
      - pytest>=7.4
      - pytest-cov>=4.1
      - ruff>=0.1.14
      - black>=23.12
      - nbformat>=5.9
      # The package itself in editable mode
      - -e .
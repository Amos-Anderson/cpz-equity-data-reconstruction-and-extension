[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factor_pipeline"
version = "0.1.0"
description = "Industry-grade long/short fundamental factor investing pipeline for US equities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Amos Anderson"},
]
license = {text = "Proprietary - Academic Use"}

dependencies = [
    # Data
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "polars>=0.20",
    # Stats
    "statsmodels>=0.14",
    "scipy>=1.11",
    "arch>=6.2",
    # Optimization
    "cvxpy>=1.4",
    # ML
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    # Plotting
    "plotly>=5.18",
    "kaleido>=0.2",
    # Config / IO
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    # WRDS / execution
    "wrds>=3.2",
    "alpaca-py>=0.20",
    # Utilities
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.14",
    "black>=23.12",
    "ipykernel>=6.27",
    "jupyter>=1.0",
    "nbformat>=5.9",
    "ipykernel>=6.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D203", "D212", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.black]
line-length = 100
target-version = ["py311"]
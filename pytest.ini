[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests requiring data/credentials
    stage1: Stage 1 tests
    stage2: Stage 2 tests
    stage3: Stage 3 tests
    stage4: Stage 4 tests
    stage5: Stage 5 tests
    stage6: Stage 6 tests
    stage7: Stage 7 tests
    stage8: Stage 8 tests
    stage9: Stage 9 tests
    stage10: Stage 10 tests
    stage11: Stage 11 tests